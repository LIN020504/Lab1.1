
name: Security REST API CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  security-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: security-rest-api

    env:
      JWT_SECRET: test-only-secret-key-for-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx bandit pip-audit

      - name: Run automated tests
        run: python -m pytest -v

      - name: Run Bandit SAST scan
        run: python -m bandit -r main.py -f txt

      - name: Run pip-audit SCA scan
        run: python -m pip_audit -r requirements.txt
