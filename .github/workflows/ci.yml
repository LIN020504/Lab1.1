
name: Security REST API CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: security-rest-api

    env:
      JWT_SECRET: test-only-secret-key-for-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx bandit pip-audit

      - name: Run automated tests
        run: python -m pytest -v

      - name: Run Bandit SAST scan
        run: python -m bandit -r main.py -f txt

      - name: Run pip-audit SCA scan
        run: python -m pip_audit -r requirements.txt

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk SCA scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=requirements.txt --package-manager=pip --json-file-output=snyk.json

      - name: Upload Snyk scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-sca-report
          path: security-rest-api/snyk.json
          if-no-files-found: warn
